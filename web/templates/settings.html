<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengaturan — Mini Assisted</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div>
        <h1>Pengaturan</h1>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Preferensi & Notifikasi</div>
      </div>
    </header>

    <main class="section">
      <div class="section-title">
        <span>Notifikasi Web Push</span>
      </div>
      <div class="card" style="flex-direction: column; align-items: stretch; gap: 12px;">
        <div style="font-size: 0.9rem; color: var(--text-muted);">
          Aktifkan agar asisten dapat mengirimkan pengingat langsung ke layar HP bahkan saat aplikasi ditutup.
        </div>
        <button id="btn-enable-push" class="btn-primary" style="margin-top: 0;">
          Aktifkan Notifikasi di HP Ini
        </button>
        <button id="btn-test-push" class="card-action" style="width: 100%; border-radius: 8px; height: 38px; display: none;">
          Kirim Tes Notifikasi
        </button>
        <div id="push-status" style="font-size: 0.85rem; color: var(--text-muted); text-align: center;"></div>
      </div>

      <div class="section-title" style="margin-top: 24px;">
        <span>Akun</span>
      </div>
      <div class="card">
        <div class="card-content">
          <div class="card-title">Keluar dari Sesi</div>
          <div class="card-time">Hapus cookie autentikasi</div>
        </div>
        <a href="/logout" style="text-decoration: none; color: var(--accent); font-weight: 600; font-size: 0.9rem;">
          Keluar
        </a>
      </div>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item" href="/">
        <span class="nav-icon">📅</span>
        <span>Hari Ini</span>
      </a>
      <a class="nav-item" href="/chat">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </a>
      <a class="nav-item active" href="/settings">
        <span class="nav-icon">⚙️</span>
        <span>Pengaturan</span>
      </a>
    </nav>

  </div>

  <script src="/static/js/push.js"></script>
</body>
</html>
