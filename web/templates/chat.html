<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat — Mini Assisted</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--bg-dark);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .bubble-user {
      align-self: flex-end;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary-hover);
    }
    .bubble-model {
      align-self: flex-start;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .chat-input-bar {
      padding: 10px 16px;
      background: var(--bg-dark);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .chat-input:focus {
      border-color: var(--border-active);
    }
    .chat-send-btn {
      background: var(--primary);
      color: #ffffff;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="header" style="border-bottom: 1px solid var(--border); padding: 14px 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="/" style="text-decoration: none; color: var(--text-muted); font-size: 1rem;">←</a>
        <div>
          <h1 style="font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em;">Obrolan</h1>
          <div style="font-size: 0.72rem; color: var(--success); font-family: monospace;">● AKTIF</div>
        </div>
      </div>
    </header>

    <div id="chat-messages" class="chat-messages">
      <div class="empty-state">Memuat obrolan...</div>
    </div>

    <form id="chat-form" class="chat-input-bar">
      <input type="text" id="chat-input" class="chat-input" placeholder="Tulis pesan..." autocomplete="off">
      <button type="submit" id="chat-send" class="chat-send-btn">➤</button>
    </form>
  </div>


  <script>
    const msgContainer = document.getElementById('chat-messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send');

    async function loadMessages() {
      try {
        const res = await fetch('/api/chat/messages');
        if (res.status === 401) { window.location.href = '/login'; return; }
        const msgs = await res.json();
        renderMessages(msgs);
      } catch (e) {
        msgContainer.innerHTML = '<div class="empty-state">Gagal memuat pesan.</div>';
      }
    }

    function renderMessages(msgs) {
      if (!msgs || msgs.length === 0) {
        msgContainer.innerHTML = '<div class="empty-state">Mulai obrolan dengan Dara 💕</div>';
        return;
      }
      msgContainer.innerHTML = msgs.map(m => `
        <div class="bubble ${m.Role === 'user' ? 'bubble-user' : 'bubble-model'}">
          ${escapeHtml(m.Content)}
        </div>
      `).join('');
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      // Optimistic UI update
      appendBubble('user', text);
      input.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        if (res.ok) {
          appendBubble('model', data.content);
        } else {
          appendBubble('model', 'Dara lagi agak pusing jaringannya bep 💗');
        }
      } catch (err) {
        appendBubble('model', 'Gagal kirim pesan.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    function appendBubble(role, text) {
      const b = document.createElement('div');
      b.className = `bubble ${role === 'user' ? 'bubble-user' : 'bubble-model'}`;
      b.innerText = text;
      msgContainer.appendChild(b);
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    document.addEventListener('DOMContentLoaded', loadMessages);
  </script>
</body>
</html>
