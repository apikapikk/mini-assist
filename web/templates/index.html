<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Assisted</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div>
        <h1>Hari Ini</h1>
        <div style="font-size: 0.8rem; color: var(--text-muted); font-family: monospace; margin-top: 2px;" id="current-date"></div>
      </div>
    </header>


    <div class="quick-add-section">
      <form id="quick-add-form" class="quick-add-box">
        <input type="text" id="quick-add-input" class="quick-add-input" placeholder="Tulis pengingat..." autocomplete="off">
        <button type="submit" class="quick-add-btn">+</button>
      </form>
    </div>

    <main class="section">
      <div class="section-title">
        <span>Pengingat Aktif</span>
      </div>
      <div id="reminders-list" class="card-list">
        <div class="empty-state">Memuat data...</div>
      </div>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item active" href="/">
        <span class="nav-icon">📅</span>
        <span>Hari Ini</span>
      </a>
      <a class="nav-item" href="/chat">
        <span class="nav-icon">💬</span>
        <span>Chat</span>
      </a>
      <a class="nav-item" href="/settings">
        <span class="nav-icon">⚙️</span>
        <span>Pengaturan</span>
      </a>
    </nav>

  </div>

  <script src="/static/js/app.js"></script>
  <script>
    const d = new Date();
    const options = { weekday: 'long', day: 'numeric', month: 'short' };
    document.getElementById('current-date').innerText = d.toLocaleDateString('id-ID', options);
  </script>
</body>
</html>
